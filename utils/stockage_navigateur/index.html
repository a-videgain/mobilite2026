<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
// Composant Streamlit minimal (sans dépendance) : copie automatique du travail dans le
// localStorage du navigateur et relecture de la copie existante.
// Protocole : https://docs.streamlit.io/develop/concepts/custom-components
(function () {
  var dejaEnvoye = false;

  function envoyer(type, donnees) {
    var msg = { isStreamlitMessage: true, type: type };
    for (var k in donnees) { msg[k] = donnees[k]; }
    window.parent.postMessage(msg, "*");
  }

  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") { return; }
    var args = event.data.args || {};
    var cle = args.storage_key || "mpb2050_session";
    var cleBrouillon = args.draft_key || "mpb2050_brouillon";
    var contenu = args.payload || "";
    var brouillon = args.draft_payload || "";
    var ok = false, ancienValide = null, ancienBrouillon = null;

    try {
      ancienValide = window.localStorage.getItem(cle);
      ancienBrouillon = window.localStorage.getItem(cleBrouillon);
      // Copie validée : écrite seulement quand une étape est validée.
      if (contenu && contenu !== ancienValide) {
        window.localStorage.setItem(cle, contenu);
      }
      // Brouillon : écrit pendant la saisie, dans une case séparée (n'écrase jamais la copie validée).
      if (brouillon && brouillon !== ancienBrouillon) {
        window.localStorage.setItem(cleBrouillon, brouillon);
      }
      // Dès qu'une étape est validée, la copie validée contient tout : le brouillon devient inutile.
      if (args.clear_draft) {
        window.localStorage.removeItem(cleBrouillon);
      }
      ok = true;
    } catch (e) {
      ok = false;
    }

    // Une seule réponse à Python (copies trouvées au chargement), pour éviter des relances inutiles.
    if (!dejaEnvoye) {
      dejaEnvoye = true;
      envoyer("streamlit:setComponentValue", {
        value: { ok: ok, stored_valide: ancienValide, stored_brouillon: ancienBrouillon },
        dataType: "json"
      });
    }
  });

  envoyer("streamlit:componentReady", { apiVersion: 1 });
  envoyer("streamlit:setFrameHeight", { height: 0 });
})();
</script>
</body>
</html>
